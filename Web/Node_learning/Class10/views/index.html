<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>This is the home page</h1>
    <a href="/contact">Contact Us page</a><br>
    <a href="/public"> Download my Repository</a>

    <iframe id="repo-iframe" src="http://localhost:3000/public/" title="Public Repository" style="width:100%; height:600px; border:1px solid #ccc; display:none;"></iframe>
    <script>
        (function(){
            const repoLink = document.querySelector('a[href="/public"]');
            const iframe = document.getElementById('repo-iframe');
            if (!repoLink) return;
            repoLink.addEventListener('click', function(e){
                e.preventDefault();
                iframe.style.display = 'block';
                iframe.scrollIntoView({behavior: 'smooth'});
            });
        })();
    </script>
</body>
</html>
